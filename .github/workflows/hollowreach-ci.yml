name: HOLLOWREACH CI

# Typecheck + content lint + tests + production build on every push to a
# working branch and on PRs. Scoped to the hollowreach/ project.
on:
  push:
    branches: ["claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hollowreach
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hollowreach/package-lock.json
      - run: npm ci
      - name: Validate content (referential integrity)
        run: npm run validate:content
      - name: Unit tests
        run: npm test
      - name: Typecheck + production build
        run: npm run build
